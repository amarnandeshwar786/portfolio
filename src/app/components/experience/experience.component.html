<div class="content exp-bg" id="exp">
  <h1 class="heading"><span>Experience</span></h1>
  <p class="edu-subtitle">Professional timeline and key delivery impact</p>
  <div class="page-divider edu-divider"></div>

  <div class="edu-timeline">
    <div class="edu-timeline-line"></div>

    <div class="edu-card" *ngFor="let experience of experienceList">
      <div class="edu-node">
        <i class="fa" [ngClass]="experience.icon"></i>
      </div>

      <div class="edu-card-body">
        <p class="edu-year-pill">{{ experience.period }} | {{ experience.location }}</p>
        <h3 class="edu-course">{{ experience.company }}</h3>
        <p class="edu-college">{{ experience.role }}</p>
        <ul class="exp-points exp-points-timeline">
          <li *ngFor="let point of experience.highlights">{{ point }}</li>
        </ul>
        <div class="edu-card-glow" aria-hidden="true"></div>
      </div>
    </div>
  </div>
</div>
