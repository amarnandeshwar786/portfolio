<div class="content about-bg" id="mail-to">
  <div class="row">
    <div class="mail-section col-lg-4">
      <form id="contact-form" name="contact-form" class="form" #contactForm="ngForm" (ngSubmit)="onSubmit(contactForm)">
        <div class="mail-header">
          <h3>Send Your Comment</h3>
          <p>Share your message and I will get back to you soon.</p>
        </div>
        <input
          type="text"
          name="company_name"
          [(ngModel)]="formModel.hp"
          tabindex="-1"
          aria-hidden="true"
          autocomplete="off"
          style="position:absolute;left:-9999px;opacity:0;height:0;width:0;border:0;padding:0;" />
        <label class="visually-hidden" for="user_name">Name</label>
        <input
          type="text"
          id="user_name"
          name="name_name"
          placeholder="Your name"
          [(ngModel)]="formModel.name"
          required />
        <label class="visually-hidden" for="email_name">Email</label>
        <input
          type="email"
          id="email_name"
          name="email_name"
          placeholder="Your email"
          [(ngModel)]="formModel.email"
          required
          email />
        <label class="visually-hidden" for="comment">Message</label>
        <textarea
          id="comment"
          name="comment"
          placeholder="Write your message"
          cols="20"
          rows="5"
          [(ngModel)]="formModel.comment"
          required></textarea>
        <input type="submit" name="btn_submit" id="btn_submit" [value]="isSubmitting ? 'Sending...' : 'Send Message'" [disabled]="isSubmitting" />
        <p class="pro-profile" *ngIf="statusMessage">{{ statusMessage }}</p>
      </form>
    </div>
  </div>
</div>
