<div class="lang-topbar">
  <div class="lang-dropdown">
    <button type="button" class="lang-trigger" (click)="toggleLangMenu()">
      Language
    </button>
    <div class="lang-menu" *ngIf="isLangMenuOpen">
      <button type="button" class="lang-option" *ngFor="let lang of i18n.langOptions" (click)="setLang(lang.code)">
        <span class="lang-option-label">{{ lang.label }}</span>
        <span class="lang-option-code">{{ lang.short }}</span>
      </button>
    </div>
  </div>
</div>
<app-loader *ngIf="!isLoaded"></app-loader>
<div class="page-progress"><span></span></div>

<div class="container-fluid" id="container" [class.hidden]="!isLoaded">
  <div class="row">
    <app-sidebar></app-sidebar>

    <div class="content-scroller col-lg-10">
      <app-mobile-navigation></app-mobile-navigation>

      <div class="content-wrapper">
        <app-home></app-home>
        <app-about></app-about>
        <app-experience></app-experience>
        <app-projects></app-projects>
        <app-skills></app-skills>
        <app-education></app-education>
        <app-contact></app-contact>
        <app-mail-to></app-mail-to>
        <app-full-image></app-full-image>
      </div>
    </div>
  </div>
</div>

<a
  class="resume-download-btn"
  href="assets/pdf/amar-nandeshwar-2025.pdf"
  download="amar-nandeshwar-2025.pdf"
  target="_blank"
  rel="noopener noreferrer"
>
  <i class="fa fa-download" aria-hidden="true"></i>
  <span>{{ 'common.downloadResume' | t }}</span>
</a>
